name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install ruff mypy
      - run: ruff check backend/app backend/tests
      - run: mypy backend/app --ignore-missing-imports || true

  backend-tests:
    name: Backend Unit + API Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: askmydocs
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: askmydocs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U askmydocs" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://askmydocs:test_password@localhost:5432/askmydocs_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run unit + API tests (fast, no external services required)
        working-directory: backend
        run: pytest -m "unit or api" --cov=app --cov-report=xml --cov-fail-under=90
      - name: Run integration tests (real Postgres)
        working-directory: backend
        run: pytest -m integration
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  rag-evaluation:
    name: RAG Evaluation Suite (RAGAS / DeepEval)
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      JWT_SECRET_KEY: ci-test-secret
      LLM_PROVIDER: ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run evaluation regression suite
        working-directory: backend
        run: pytest -m evaluation --maxfail=1

  frontend-tests:
    name: Frontend Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test -- --ci
      - working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: askmydocs-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: askmydocs-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (main branch only, all gates passed)
    runs-on: ubuntu-latest
    needs: [rag-evaluation, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deployment
        run: |
          echo "All quality gates passed — triggering deployment."
          echo "Wire this step to your target platform's deploy hook (Render/Railway/AWS/Azure/DigitalOcean)."
          echo "See deployment/ for platform-specific configs."
